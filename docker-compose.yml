# poe-price-tool v2 — deploy (LAN-only).
#
# Reachable directly via host IP + port 8788, or behind a reverse proxy.
# IMPORTANT: The tool uses WebSockets (/events) -> enable "Websockets Support"
# on the reverse proxy, otherwise the browser tab won't connect.
# No auth (budget variant) -> expose ONLY on the LAN, NOT to the internet.

services:
  poe-price-tool:
    build:
      context: .
      args:
        # Which commit the image is built from, so the admin area can answer
        # "which version is running here". Empty unless the build is given one
        # — then the admin area says "unknown" instead of guessing:
        #   BUILD_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        # deploy/host-update.sh (the update button's host half) sets it itself.
        BUILD_COMMIT: "${BUILD_COMMIT:-}"
    image: poe-price-tool:latest
    container_name: poe-price-tool
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      # All optional — sensible defaults live in the server (server.mjs).
      # To change one, uncomment the respective line. (PORT stays set so that
      # `environment:` remains a valid list — don't comment out everything,
      # otherwise: "environment must be a mapping".)
      - PORT=8788                   # Server port (must match the port mapping above)
      # - POE_LEAGUE=Standard       # Starting league (every user can switch it in the browser)
      # - POE_USERS=player1,player2 # fixed user list (no login, routing only)
      # - POE_USER_LANGS=player2:de # STARTING client language per user (default: en for everyone).
      #                             # A language the user picks himself on the settings page is stored
      #                             # in /config/user-langs.json and WINS over this — see docs/admin.md
      # - POE_USER_LANG_STORE=/config/user-langs.json  # where those per-user choices are stored
      # - POE_LANG_DEFAULT=en       # language for everyone with no entry and no stored choice
      # - POE_CONFIG_OVERRIDES=/config/overrides.json  # settings written by the admin area.
      #                             # NOTE: values in that file OVERRIDE the ones set here — the admin
      #                             # area is the newer, deliberate decision. docs/admin.md explains it
      # - POE_PATCH_VERSION=3.29.2.1 # only if the patch lookup (ggpk.exposed) is unavailable/wrong;
      #                              # the localized data set is generated per patch, normally without this
      # - POE_APP_NAME=YourName     # landing-page header/title brand name (default: Trade Console)
      # - POE_MAX_LISTINGS=10       # Trade listings per search (hard cap <=10)
      # - POE_CD_RATIO=215          # Chaos:Divine fallback when poe.ninja is unreachable
      # - POE_CD_REFRESH_MS=900000  # C:D refresh interval; 900000 (15min) is also the MINIMUM (poe.ninja rule)
      # - POE_NETWORTH_CONFIG=/config/networth-users.json  # per-user accountName+POESESSID (NEVER in the repo)
      # - POE_NETWORTH_STORE=/config/networth-store.json   # snapshot store (value-over-time history)
      # - POE_NETWORTH_AUTOSYNC=0   # background auto-refresher for the net-worth store; =0 disables it (on by default)
      # - POE_NETWORTH_SYNC_INTERVAL_MS=30000  # delay between auto-refresher ticks (one tab/tick); min 30000
      # - POE_NETWORTH_LIST_TTL_MS=900000      # how long the cached stash-tab list is considered fresh
      # - POE_NETWORTH_COOLDOWN_MS=600000      # backoff after a 429 before retrying a user; min 600000 (longer only)
      # - POE_NETWORTH_DEBUG=1      # one log line per scanned stash tab (raw/priced/unpriced/skipped) — diagnosis only
      # - POE_FAUSTUS_STORE=/config/faustus-store.json  # path of the Faustus name->chaos store
      # - POE_FAUSTUS_DISABLED=1    # Disable the Faustus background refresher (falls back to poe.ninja)
      # - POE_FAUSTUS_UNION_HOURS=8 # completed hourly Faustus digests to union before deriving prices
      # - POE_FAUSTUS_REFRESH_MS=3600000   # Faustus refresh interval; min 3600000 (the digests are hourly)
      # - POE_FAUSTUS_TTL_MS=172800000     # max staleness (~48h) before falling through to poe.ninja
      # - POE_REFERENCE_HISTORY=/config/reference-history.ndjson  # rolling price series behind the left rail's sparklines (7 days)
      # - POE_CORPSE_STORE=/config/corpse-store.json  # path of the itemised-corpse price store
      # - POE_CORPSE_DISABLED=1     # Disable the corpse background pricer (corpses stay unpriced)
      # - POE_CORPSE_TTL_MS=21600000       # how long a cached corpse price/null stays fresh (~6h); min 3600000
      # - POE_CORPSE_BUDGET_PER_HOUR=25    # max distinct corpse names queried on the Trade API/hour (max 30 —
      #                                    # more than the pacing can spend); =0 means NO query at all
      #                                    # (cached prices are still served)
      # - POE_CORPSE_INTERVAL_MS=120000    # delay between corpse pricer ticks (one name/tick); min 120000
      # - POE_MAX_ITEMS_PER_ROOM=50        # server-side item-card cap per room (oldest evicted first)
      # - POE_MAX_REQUEUE_ON_RECONNECT=10  # max items re-queued for a room on WS reconnect
      # - POE_DATA_REFRESH_MS=86400000     # data auto-update interval (APT data, base-names; conditional requests, ~daily); min 3600000
      # - POE_DATA_REFRESH_DISABLED=1      # disable the data auto-update (a valid persisted snapshot is still preferred at boot)
      # - POE_DATA_REFRESH_DIR=/config/data-refresh  # where adopted data snapshots + update state persist
      # - POE_RELEASE_CHECK_DISABLED=1     # disable the once-a-day check for a newer release on GitHub (the manual check on the settings page still works)
      # - POE_RELEASE_REPO=owner/repo      # GitHub repository asked for the latest release (default: this project's own)
      # - POE_RELEASE_CHECK_STATE=/config/release-check.json  # where the last answer persists
      # --- settings page / admin area (see docs/admin.md) ---
      # - POE_ADMIN_PASSWORD_FILE=/config/admin-password  # plaintext password for the admin area; created with "admin" on first boot. CHANGE IT before exposing this tool beyond the LAN
      # - POE_GAP_LOG_MAX=200              # distinct gaps kept per kind (failed parses / unresolved mods); the least frequent are dropped over the cap
      # - POE_GAP_LOG_TEXT_MAX=400         # characters kept per recorded text
      # - POE_LANG_SKEW_WARN_RATIO=0.005   # fraction of the English set a localized one may lack before the admin view warns
      # --- the update button (needs deploy/host-update.sh on the HOST; install: docs/runbooks.md, "Install the update script") ---
      # - POE_UPDATE_DIR=/config           # where the container leaves its update request and reads the host script's
      #                                    # heartbeat + result. Must be the same directory the script has as CONFIG_DIR
      # - POE_UPDATE_HEARTBEAT_MAX_AGE_MS=1200000  # how old the host script's heartbeat may get before the admin area
      #                                    # says no updater is installed (20 min = three missed 5-minute runs + slack).
      #                                    # Raise it if you run the script on a slower schedule — or if you drive the
      #                                    # script with a systemd Type=oneshot timer, which starts no second run to
      #                                    # refresh the heartbeat while a build is in progress (docs/runbooks.md)
    volumes:
      # Persistent per-user config (POESESSID, stores, history).
      #
      # THIS IS THE ONLY MOUNT, AND THE UPDATE BUTTON DEPENDS ON THAT. The
      # container may write in here, and the host script that rebuilds this
      # image runs as root over the same directory. Do not add a mount of the
      # CHECKOUT (the directory this file is in) or of anything containing it:
      # whoever took over the container could then rewrite this file, the
      # Dockerfile and the source, and the next update would build it on the
      # host. deploy/host-update.sh refuses to run when its checkout sits inside
      # the shared directory, which is that same danger reached from the paths
      # instead of from the mounts.
      #
      # That `./config` is INSIDE the checkout is fine and is the normal
      # arrangement: a bind mount goes one way, so the container sees this
      # directory and not the tree it was taken from. What it does mean is that
      # the config directory lies in the BUILD CONTEXT, which is why
      # .dockerignore excludes it — POESESSID and the admin password live in
      # here and have no business being sent to the docker daemon. The host
      # script checks that exclusion before it builds. See docs/runbooks.md,
      # "Install the update script".
      - ./config:/config
